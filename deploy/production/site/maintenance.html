<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="60">
<title>Fleetbase is being updated</title>
<style>
:root { color-scheme: light dark; --bg: #f5f7fa; --surface: #ffffff; --border: #e2e6ec; --text: #0f1724; --muted: #5a6375; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b1220; --surface: #111a2b; --border: #223047; --text: #edf1f7; --muted: #9aa6b9; } }
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; background: var(--bg); color: var(--text); font: 16px/26px Inter, system-ui, sans-serif; }
main { max-width: 480px; padding: 32px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
h1 { margin: 0 0 8px; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.02em; }
p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
<h1>Fleetbase is being updated</h1>
<p>It'll be back shortly, and nothing you've saved is affected. This page refreshes by itself, so you can leave it open.</p>
</main>
</body>
</html>
