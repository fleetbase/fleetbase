name: API Contract (Postman)

# Reusable workflow: boot a full Fleetbase stack and run the official Postman
# collections against the live API. Called centrally (build from source) and by
# module repos (fleetops/storefront/ledger/core-api) which pull the published
# image and run only their own collection:
#
#   jobs:
#     contract:
#       uses: fleetbase/fleetbase/.github/workflows/api-contract.yml@main
#       with:
#         collections: "Fleetbase Storefront API"
#         build-from-source: false
#         # Without overlay-package the run tests the version of this module baked into
#         # the published image, NOT the branch under review.
#         overlay-package: fleetbase/storefront-api
#       secrets: inherit
#
# To test a release train before anything is tagged, a caller adds `stack: <name>`
# (a file in .github/contract-stacks/). The stack sets the fleetbase ref, builds the
# image from it, and links every listed package from its branch, with the caller's
# own entry replaced by the commit under test. `extra-overlays` adds packages the
# stack doesn't list.
#
# Requires org-level secrets POSTMAN_API_KEY and _GITHUB_AUTH_TOKEN (inherited).

on:
  workflow_call:
    inputs:
      collections:
        description: Comma/newline-separated collection names under postman/collections.
        type: string
        required: false
        default: |
          Fleetbase API
          Fleetbase Core API
          Fleetbase Storefront API
          Fleetbase Ledger API
      build-from-source:
        description: Build the API image from this repo (central) instead of pulling :latest.
        type: boolean
        required: false
        default: false
      fleetbase-ref:
        description: >-
          Ref of fleetbase/fleetbase to boot (ships the compose files, installer and
          composite action). Tracks main by default so contract runs always exercise
          the current platform — there is no per-release version to remember to bump.
          Pin to a tag only when reproducing a specific failure.
        type: string
        required: false
        default: main
      api-image:
        description: >-
          API image to test against. Defaults to :latest, which is what each release
          publishes, so this tracks the newest platform automatically. Pin to e.g.
          fleetbase/fleetbase-api:v0.7.53 to reproduce an older result.
        type: string
        required: false
        default: fleetbase/fleetbase-api:latest
      overlay-package:
        description: >-
          Composer package inside the API image to replace with the CALLING repository's
          checked-out source, e.g. fleetbase/fleetops-api. Without this a module's
          contract run exercises whatever version of that module is baked into the
          published image, not the branch under review — so a PR's own API changes are
          never actually tested. Leave empty to test the image as published.
        type: string
        required: false
        default: ''
      overlay-path:
        description: >-
          Directory within the calling repository that is the package root (the folder
          containing its composer.json). Defaults to the repository root.
        type: string
        required: false
        default: .
      postman-ref:
        description: Ref of fleetbase/postman to run.
        type: string
        required: false
        default: main
      stack:
        description: >-
          Name of a file in .github/contract-stacks/ (without .json) listing packages to
          link from branches before the run, for testing a release train before anything
          is tagged. The stack also sets fleetbase-ref and build-from-source. The calling
          repository's own entry is replaced by the commit under test. Leave empty for the
          usual single-package overlay.
        type: string
        required: false
        default: ''
      stack-ref:
        description: Ref of fleetbase/fleetbase to read the stack file from.
        type: string
        required: false
        default: main
      extra-overlays:
        description: >-
          More packages to link from branches, one a line: `owner/repo@ref composer/package [path]`.
          Added to the stack's list. Every linked package goes in as a Composer path
          repository, and the whole app is re-resolved against them.
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # Cheap gate so callers don't spend ~10 minutes booting the stack when the
  # Postman secret isn't configured yet. Skips the whole contract job if absent.
  gate:
    name: Check Postman secret
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        run: |
          if [[ -n "${{ secrets.POSTMAN_API_KEY }}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::POSTMAN_API_KEY is not set; skipping the API contract run."
          fi

  contract:
    name: Postman contract against live API
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Resolved before anything else, because a stack sets which fleetbase ref to boot.
      # Read through the API rather than a checkout, which would be wiped by the
      # workspace checkout below.
      - name: Resolve contract stack
        id: stack
        env:
          GH_TOKEN: ${{ secrets._GITHUB_AUTH_TOKEN || github.token }}
          STACK: ${{ inputs.stack }}
          STACK_REF: ${{ inputs.stack-ref }}
          EXTRA_OVERLAYS: ${{ inputs.extra-overlays }}
          CALLER: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "$STACK" && -z "$EXTRA_OVERLAYS" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          resolver="$RUNNER_TEMP/resolve-contract-stack.py"
          gh api -H 'Accept: application/vnd.github.raw' \
            "repos/fleetbase/fleetbase/contents/scripts/ci/resolve-contract-stack.py?ref=${STACK_REF}" > "$resolver"
          stack_file=""
          if [[ -n "$STACK" ]]; then
            if [[ ! "$STACK" =~ ^[a-z0-9_-]+$ ]]; then
              echo "::error::Invalid stack name."; exit 1
            fi
            stack_file="$RUNNER_TEMP/stack.json"
            gh api -H 'Accept: application/vnd.github.raw' \
              "repos/fleetbase/fleetbase/contents/.github/contract-stacks/${STACK}.json?ref=${STACK_REF}" > "$stack_file"
          fi
          python3 "$resolver" "$stack_file" "$CALLER" "$EXTRA_OVERLAYS" > "$RUNNER_TEMP/stack.out"
          cat "$RUNNER_TEMP/stack.out" >> "$GITHUB_OUTPUT"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          {
            echo "### Contract stack \`${STACK:-extra overlays}\` from fleetbase/fleetbase@${STACK_REF}"
            echo '```'
            cat "$RUNNER_TEMP/stack.out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout fleetbase/fleetbase
        uses: actions/checkout@v4
        with:
          repository: fleetbase/fleetbase
          ref: ${{ steps.stack.outputs.fleetbase_ref || inputs.fleetbase-ref }}
          submodules: recursive
          token: ${{ secrets._GITHUB_AUTH_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # A stack is resolved into the root lock BEFORE the image is built, so the image is a
      # fresh install of the whole train. The Dockerfile installs from the lock before it
      # copies the app, and Composer refuses a lock that no longer satisfies composer.json,
      # so linking packages into a running container afterwards cannot move the framework.
      - name: Checkout calling repository for the stack
        if: ${{ steps.stack.outputs.enabled == 'true' && inputs.overlay-package != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          token: ${{ secrets._GITHUB_AUTH_TOKEN }}
          path: .overlay

      - name: Set up PHP for the stack
        if: ${{ steps.stack.outputs.enabled == 'true' }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Resolve the stack into the root lock
        if: ${{ steps.stack.outputs.enabled == 'true' }}
        env:
          CALLER_PACKAGE: ${{ inputs.overlay-package }}
          CALLER_PATH: ${{ inputs.overlay-path }}
          OVERLAYS: ${{ steps.stack.outputs.overlays }}
          GIT_TOKEN: ${{ secrets._GITHUB_AUTH_TOKEN || github.token }}
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets._GITHUB_AUTH_TOKEN }}"}}'
        run: |
          set -euo pipefail
          packages="api/.contract-packages"
          rm -rf "$packages"; mkdir -p "$packages"
          : > "$RUNNER_TEMP/linked.txt"
          n=0

          link() {
            local src="$1" pkg="$2" from="$3" version
            if [[ ! -f "$src/composer.json" ]]; then
              echo "::error::No composer.json at ${src} for ${pkg}."; exit 1
            fi
            version="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["name"] == sys.argv[2], "package name mismatch"; assert isinstance(d.get("version"), str) and d["version"], "no version in composer.json"; print(d["version"])' "$src/composer.json" "$pkg")"
            mkdir -p "${packages}/${n}"
            tar -C "$src" --exclude=.git -cf - . | tar -C "${packages}/${n}" -xf -
            echo "${n} ${pkg} ${version} ${from}" >> "$RUNNER_TEMP/linked.txt"
            n=$((n + 1))
          }

          if [[ -n "$CALLER_PACKAGE" ]]; then
            link ".overlay/${CALLER_PATH}" "$CALLER_PACKAGE" "${{ github.repository }}@${{ github.sha }}"
          fi
          while read -r repository ref package path; do
            [[ -z "${repository:-}" ]] && continue
            dir="$RUNNER_TEMP/stack/${n}"
            git clone --quiet --depth 1 --branch "$ref" "https://x-access-token:${GIT_TOKEN}@github.com/${repository}.git" "$dir"
            link "${dir}/${path}" "$package" "${repository}@${ref} ($(git -C "$dir" rev-parse --short HEAD))"
          done <<< "$OVERLAYS"

          cd api
          while read -r i pkg version _; do
            composer config "repositories.contract-stack-${i}" "{\"type\":\"path\",\"url\":\"./.contract-packages/${i}\",\"options\":{\"symlink\":false}}"
            composer require "${pkg}:${version}" --no-update --no-scripts --no-interaction
          done < "$RUNNER_TEMP/linked.txt"
          composer update --no-scripts --no-interaction --no-progress --ignore-platform-req='ext-*'
          composer show "fleetbase/*"
          composer show laravel/framework | head -4
          audit="$(composer audit --locked 2>&1 || true)"
          echo "$audit"

          {
            echo "### Packages linked from branches"
            echo
            echo "| Package | Version | Source |"
            echo "| --- | --- | --- |"
            while read -r _ pkg version from; do echo "| \`${pkg}\` | ${version} | ${from} |"; done < "$RUNNER_TEMP/linked.txt"
            echo
            echo "The root lock was re-resolved against these before the image was built."
            echo
            echo '```'
            echo "$audit"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # The image installs from the lock before it copies the app, so the linked
          # packages go in first. docker/Dockerfile is in .dockerignore, so the copy lives
          # outside the build context.
          cd ..
          anchor='COPY --chown=www-data:www-data ./api/composer.json ./api/composer.lock /fleetbase/api/'
          grep -qxF "$anchor" docker/Dockerfile || { echo "::error::Dockerfile no longer copies the lock the way this step expects."; exit 1; }
          awk -v anchor="$anchor" '$0 == anchor { print "COPY --chown=www-data:www-data ./api/.contract-packages /fleetbase/api/.contract-packages" } { print }' \
            docker/Dockerfile > "$RUNNER_TEMP/Dockerfile.contract-stack"

      - name: Build API image from source
        if: ${{ inputs.build-from-source || steps.stack.outputs.build_from_source == 'true' }}
        run: |
          dockerfile=docker/Dockerfile
          if [[ "${{ steps.stack.outputs.enabled }}" == "true" ]]; then
            dockerfile="$RUNNER_TEMP/Dockerfile.contract-stack"
          fi
          docker build \
            --file "$dockerfile" \
            --target app-release \
            --build-arg GITHUB_AUTH_KEY="${{ secrets._GITHUB_AUTH_TOKEN }}" \
            --tag fleetbase/fleetbase-api:latest \
            .

      - name: Pull published API image
        if: ${{ !inputs.build-from-source && steps.stack.outputs.build_from_source != 'true' }}
        run: |
          docker pull "${{ inputs.api-image }}"
          # :latest is a moving target, so record the digest and build date the run
          # actually used — otherwise a red run months from now is unreproducible.
          # Raw newlines collapse in markdown, so fence it. `join` tolerates an image
          # with no digest instead of erroring the way `index` would. The format string
          # stays on one line — a wrapped one would end this YAML block scalar.
          {
            echo "### API image under test"
            echo '```'
            docker image inspect "${{ inputs.api-image }}" --format 'requested: ${{ inputs.api-image }}{{"\n"}}tags:      {{join .RepoTags ", "}}{{"\n"}}digest:    {{join .RepoDigests ", "}}{{"\n"}}created:   {{.Created}}'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # Retag so the compose file's fleetbase/fleetbase-api:latest reference resolves
          # to the requested image even when a specific tag was asked for.
          if [[ "${{ inputs.api-image }}" != "fleetbase/fleetbase-api:latest" ]]; then
            docker tag "${{ inputs.api-image }}" fleetbase/fleetbase-api:latest
          fi

      - name: Ensure clean database volume
        run: |
          sudo rm -rf docker/database/mysql
          mkdir -p docker/database/mysql

      - name: Run non-interactive installer
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          [ -f api/.env ] || cp api/.env.example api/.env 2>/dev/null || touch api/.env

          # The public API throttles 120 requests/minute, and ThrottleRequests sits
          # FIRST in the fleetbase.api middleware group — before authentication — so
          # $request->user() is null and the bucket is keyed per IP rather than per API
          # key. A contract run is ~180 requests in about a minute from one runner, so
          # it throttles itself: measured, 61 requests came back
          # {"errors":["Too many requests."]}, every one of them a false failure.
          #
          # Must be the literal string false. ThrottleRequests checks
          # `config('api.throttle.enabled', true) === false`, and env() casts "false" to
          # a boolean but leaves "0" as the string "0", which is !== false and would
          # silently leave throttling on.
          if grep -q '^THROTTLE_ENABLED=' api/.env; then
            sed -i 's/^THROTTLE_ENABLED=.*/THROTTLE_ENABLED=false/' api/.env
          else
            echo 'THROTTLE_ENABLED=false' >> api/.env
          fi
          echo "Throttling disabled for the contract run: $(grep '^THROTTLE_ENABLED=' api/.env)"

          # Place::createFromMixed resolves a place string by matching an existing
          # street1/name first, then falls through to createFromGeocodingLookup. The
          # order shapes that send a real street address ("Singapore 018971") have no
          # seeded match, so without a key they cannot resolve and those requests fail
          # for a reason that has nothing to do with the API under test.
          #
          # Optional on purpose: absent, the run still covers createFromMixed through
          # the coordinate and GeoJSON shapes, which need no external service.
          if [[ -n "${GOOGLE_MAPS_API_KEY:-}" ]]; then
            if grep -q '^GOOGLE_MAPS_API_KEY=' api/.env; then
              sed -i "s|^GOOGLE_MAPS_API_KEY=.*|GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}|" api/.env
            else
              echo "GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}" >> api/.env
            fi
            echo "Geocoding enabled: address-string place resolution will use Google Maps."
          else
            echo "::notice::GOOGLE_MAPS_API_KEY not set; order shapes that send a street address cannot geocode. Coordinate and GeoJSON shapes are unaffected."
          fi

          # The verification-code endpoints deliver by SMS and fall back to email. With
          # no usable from-address the fallback dies inside Symfony —
          #   Email "null" does not comply with addr-spec of RFC 2822
          # — which surfaced as 400s on three requests and a 500 on Send Work Order.
          #
          # api/.env.example ships the literal string MAIL_FROM_ADDRESS=null, which
          # OVERRIDES config/mail.php's default rather than falling back to it.
          #
          # This must run BEFORE the installer brings the stack up. Laravel parses .env
          # once at boot, and an earlier attempt to set it afterwards did not take:
          # config:clear and octane:reload both ran and the endpoints still answered
          # Email "null", because the workers were already holding the parsed values.
          #
          # The log mailer delivers nothing, so no mail leaves the runner; the endpoints
          # simply become exercisable. MAIL_MAILER is already log via the installer's
          # generated compose override.
          set_env() {
            if grep -q "^$1=" api/.env; then
              sed -i "s|^$1=.*|$1=$2|" api/.env
            else
              echo "$1=$2" >> api/.env
            fi
          }
          # The storefront review-account bypass, pointed at the seeded customer. This is
          # the same mechanism App Store review uses, and it is inert without BOTH values
          # — the code alone is not accepted for an identity that is not listed. It lets
          # verification be exercised without a live SMS provider.
          #
          # Both of the customer's identities are listed, because the collection verifies
          # under whichever one the request names: Verify Phone Number sends the phone,
          # while Verify a SMS code sends {{customer_identity}}, the email. With only the
          # phone listed the latter answered "Invalid verification code!" every run.
          set_env STOREFRONT_BYPASS_VERIFICATION_CODE 000000
          set_env STOREFRONT_REVIEW_ACCOUNTS '+15555550123,ci-customer@fleetbase.local'
          set_env MAIL_MAILER log
          set_env MAIL_FROM_ADDRESS ci-contract@fleetbase.local
          echo "Mail transport: log (from ci-contract@fleetbase.local)"

          # Socket auth stays OFF, as it is in production until the rollout in
          # fleetbase/fleetbase#710 reaches it. The socket-token endpoints answer 404
          # while it is off, and the collections assert exactly that (Storefront's Create
          # Customer Socket Token sets expected_status 404 unless the environment declares
          # socket_auth_enabled). Switch it on here only once production has.

          bash scripts/docker-install.sh --non-interactive



      - name: Wait for API health
        run: |
          set -uo pipefail
          for _attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 http://localhost:8000/health | grep -q '"status"'; then
              echo "API is healthy"; exit 0
            fi
            sleep 5
          done
          echo "::error::API did not become healthy"; exit 1

      # In a reusable workflow github.repository/github.sha refer to the CALLER, so this
      # checks out the module branch under review rather than fleetbase/fleetbase.
      - name: Checkout calling repository for overlay
        if: ${{ inputs.overlay-package != '' && steps.stack.outputs.enabled != 'true' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          token: ${{ secrets._GITHUB_AUTH_TOKEN }}
          path: .overlay

      - name: Install branch source and resolve its Composer dependencies
        if: ${{ inputs.overlay-package != '' && steps.stack.outputs.enabled != 'true' }}
        env:
          OVERLAY_PACKAGE: ${{ inputs.overlay-package }}
          OVERLAY_PATH: ${{ inputs.overlay-path }}
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets._GITHUB_AUTH_TOKEN }}"}}'
        run: |
          set -euo pipefail
          PKG="$OVERLAY_PACKAGE"
          SRC=".overlay/${OVERLAY_PATH}"

          if [[ ! "$PKG" =~ ^[a-z0-9]([a-z0-9_.-]*[a-z0-9])?/[a-z0-9]([a-z0-9_.-]*[a-z0-9])?$ ]]; then
            echo "::error::Invalid Composer overlay package name."
            exit 1
          fi
          DEST="/fleetbase/api/vendor/${PKG}"

          if [[ ! -f "$SRC/composer.json" ]]; then
            echo "::error::No composer.json at ${SRC}; set overlay-path to the package root."
            exit 1
          fi

          WAS="$(docker compose exec -T application sh -c "cat ${DEST}/composer.json 2>/dev/null" \
                  | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version","unknown"))' 2>/dev/null || echo unknown)"

          VERSION="$(python3 -c 'import json,sys; package=json.load(open(sys.argv[1])); assert package["name"] == sys.argv[2], "Overlay package name mismatch"; assert isinstance(package.get("version"), str) and package["version"], "Overlay package must declare its version"; print(package["version"])' "$SRC/composer.json" "$PKG")"

          # A source-only copy leaves dependencies at the image's old versions. Use a
          # canonical path repository so Composer installs this exact checkout AND
          # enforces its requirements (including newly released Core API versions).
          docker compose exec -T application sh -c 'mkdir -p /tmp/fleetbase-contract-package'
          tar -C "$SRC" --exclude=.git -cf - . | docker compose exec -T application sh -c 'tar -C /tmp/fleetbase-contract-package -xf -'
          docker compose exec -T application chown -R www-data:www-data /tmp/fleetbase-contract-package
          docker compose exec -T \
            -e COMPOSER_AUTH \
            -e "CI_OVERLAY_PACKAGE=${PKG}" \
            -e "CI_OVERLAY_VERSION=${VERSION}" \
            application su www-data -s /bin/sh -c '
              set -eu
              cd /fleetbase/api
              composer config repositories.contract-overlay "{\"type\":\"path\",\"url\":\"/tmp/fleetbase-contract-package\",\"options\":{\"symlink\":false}}"
              composer require "$CI_OVERLAY_PACKAGE:$CI_OVERLAY_VERSION" --no-update --no-scripts --no-interaction
              composer update "$CI_OVERLAY_PACKAGE" --with-all-dependencies --minimal-changes --no-dev --no-scripts --no-interaction --prefer-dist --no-progress --optimize-autoloader
              composer show "fleetbase/*"
              php artisan package:discover --ansi
            '

          # A branch may ship new migrations, and stale caches would mask new routes/config.
          docker compose exec -T application su www-data -s /bin/sh -c \
            "cd /fleetbase/api && php artisan optimize:clear" 2>&1 | tail -5
          docker compose exec -T application su www-data -s /bin/sh -c \
            "cd /fleetbase/api && php artisan migrate --force" 2>&1 | tail -10

          # Octane (frankenphp) boots the framework ONCE, when the container starts — which
          # is before this overlay. Classes are autoloaded lazily, so the branch's
          # controllers do take effect on the first request that needs them; anything
          # resolved during BOOT does not. Service providers have already run, and
          # mergeConfigFrom() merged the PUBLISHED package's config, so a config key the
          # branch adds simply does not exist at runtime.
          #
          # That is exactly what hid storefront's review-account bypass. The published
          # config/storefront.php has only bypass_verification_code; the branch adds
          # review_accounts, and isReviewAccountBypass() requires the identity to appear in
          # that allowlist — which resolved to [] via config()'s default. Request Phone
          # Verification and Verify Phone Number failed for two releases against values this
          # workflow had correctly written to .env before boot.
          #
          # Reloading the workers re-runs the providers against the overlaid files. This is
          # NOT the same as the .env case documented above: those values are parsed by the
          # master process, which a worker reload does not restart — which is why they are
          # still written before the stack comes up.
          docker compose exec -T application su www-data -s /bin/sh -c \
            "cd /fleetbase/api && php artisan octane:reload" 2>&1 | tail -3

          # The reload is asynchronous, so give the workers a moment to come back rather
          # than racing the first collection request against a restarting pool.
          for i in $(seq 1 20); do
            if curl -fsS --max-time 5 http://localhost:8000/health | grep -q '"status"'; then
              echo "API healthy after octane:reload"; break
            fi
            if [[ $i -eq 20 ]]; then
              echo "::error::API did not come back after octane:reload"; exit 1
            fi
            sleep 3
          done

          {
            echo "### Package under test"
            echo
            echo "\`${PKG}\` replaced with **${{ github.repository }}@${{ github.sha }}**"
            echo "(image shipped version \`${WAS}\`)."
            echo "Composer resolved the checkout's required dependencies before discovery and migrations."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Re-check API health after overlay
        if: ${{ inputs.overlay-package != '' && steps.stack.outputs.enabled != 'true' }}
        run: |
          for _attempt in $(seq 1 20); do
            if curl -fsS --max-time 5 http://localhost:8000/health | grep -q '"status"'; then
              echo "API healthy after overlay"; exit 0
            fi
            sleep 3
          done
          echo "::error::API did not recover after overlaying ${{ inputs.overlay-package }}"
          docker compose logs --no-color --tail=100 application || true
          exit 1

      - name: Run Postman contract
        uses: ./.github/actions/postman-contract
        with:
          collections: ${{ inputs.collections }}
          postman-ref: ${{ inputs.postman-ref }}
          postman-api-key: ${{ secrets.POSTMAN_API_KEY }}
          github-token: ${{ secrets._GITHUB_AUTH_TOKEN }}
          # TEST-mode keys only. The live pair also exists in the org secrets and must
          # never be referenced here — a contract run creates payment intents.
          stripe-publishable-key: ${{ secrets.STRIPE_TEST_KEY }}
          stripe-secret-key: ${{ secrets.STRIPE_TEST_SECRET }}

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color --tail=300 || true

      - name: Tear down
        if: always()
        run: docker compose down -v || true
