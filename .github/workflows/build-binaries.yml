name: Build Fleetbase Binaries

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Create Release"]
    types: [completed]

permissions:
  contents: write

env:
  DIST_DIR: builds/dist
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-linux:
    name: Linux Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build Linux binary
        run: |
          set -o pipefail
          chmod +x ./builds/linux/build-linux.sh
          ./builds/linux/build-linux.sh 2>&1 | tee build-linux.log
      - name: Upload Linux build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fleetbase-linux-build-log
          path: build-linux.log
          if-no-files-found: ignore
      - name: Upload Linux binary
        if: github.event_name == 'workflow_run'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.workflow_run.head_branch }}
          files: |
            ${{ env.DIST_DIR }}/fleetbase-linux-x86_64
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: macOS (ARM64) Build
    needs: build-linux
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      # Go is not on PATH on the macOS runner image. Pin to the same Go line as
      # the Linux builder image (FrankenPHP v1.9.0 and Caddy v2.10.0 need 1.24).
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Install build dependencies
        run: |
          # static-php-cli 2.5.2 needs PHP >= 8.3 as its tooling runtime. php@8.4
          # is keg-only, so link it onto PATH so build-osx.sh picks it up instead
          # of falling back to compiling PHP with asdf.
          brew install autoconf automake coreutils jq composer php@8.4
          brew link --overwrite --force php@8.4
          php -v
          composer --version
          go version
      - name: Build macOS binary
        run: |
          chmod +x ./builds/osx/build-osx.sh
          ./builds/osx/build-osx.sh
      - name: Upload macOS binary
        if: github.event_name == 'workflow_run'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.workflow_run.head_branch }}
          files: |
            ${{ env.DIST_DIR }}/fleetbase-darwin-arm64
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
