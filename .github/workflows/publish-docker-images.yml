name: Fleetbase Docker Images

permissions:
    contents: read

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            branch:
                description: 'Branch to build from'
                required: false
                default: 'main'
            version:
                description: 'Image version tag (e.g., v0.7.1-beta)'
                required: false

jobs:
    docker-release:
        name: Build and Push Docker Images
        runs-on: ubuntu-latest

        env:
            REGISTRY: fleetbase
            VERSION: ${{ github.event.inputs.version || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && github.ref_name) || 'manual' }}

        steps:
            - name: Checkout Repo
              uses: actions/checkout@v3
              with:
                  ref: ${{ github.event.inputs.branch || github.ref_name }}
                  submodules: recursive

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v2

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_HUB_USERNAME }}
                  password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

            - name: Build and Push Console & API Images
              uses: docker/bake-action@v2
              with:
                  push: true
                  targets: |
                      fleetbase-console
                      fleetbase-api
                  files: |
                      ./docker-bake.hcl

    # Tell fleetbase/showcase that this tag's images exist, so it can screenshot the release.
    #
    # A job with `needs:` rather than a workflow_run trigger in the other repo: needs gives a real
    # success dependency, so the event fires only after BOTH images are actually pushed, and the
    # tag comes straight from this run instead of workflow_run's indirection. (The existing
    # workflow_run consumers of this workflow do not gate on conclusion and fire on failure too.)
    #
    # Setup: a fine-grained PAT scoped to fleetbase/showcase only, with Contents: read and write
    # (the dispatches endpoint requires write), stored here as SHOWCASE_DISPATCH_TOKEN. Follows the
    # FLEETBASE_IO_DISPATCH_TOKEN precedent in fleetbase/postman — a purpose-scoped token per
    # direction, never the org-wide _GITHUB_AUTH_TOKEN. Publishing never fails because of this
    # job: a missing token is a warning, not an error.
    notify-showcase:
        name: Notify fleetbase/showcase
        needs: docker-release
        runs-on: ubuntu-latest
        if: github.ref_type == 'tag' || github.event.inputs.version != ''
        steps:
            - name: Send repository_dispatch to fleetbase/showcase
              env:
                  DISPATCH_TOKEN: ${{ secrets.SHOWCASE_DISPATCH_TOKEN }}
                  TAG: ${{ github.event.inputs.version || github.ref_name }}
                  SHA: ${{ github.sha }}
                  ACTOR: ${{ github.actor }}
              run: |
                  if [ -z "$DISPATCH_TOKEN" ]; then
                    echo "::warning::SHOWCASE_DISPATCH_TOKEN is not set; fleetbase/showcase was not notified of $TAG."
                    exit 0
                  fi
                  status=$(curl -sS -o /tmp/dispatch.out -w "%{http_code}" \
                    -X POST \
                    -H "Accept: application/vnd.github+json" \
                    -H "Authorization: Bearer $DISPATCH_TOKEN" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    https://api.github.com/repos/fleetbase/showcase/dispatches \
                    -d "{\"event_type\":\"fleetbase-release\",\"client_payload\":{\"tag\":\"$TAG\",\"sha\":\"$SHA\",\"actor\":\"$ACTOR\"}}")
                  if [ "$status" != "204" ]; then
                    echo "::error::Dispatch to fleetbase/showcase failed (HTTP $status)"
                    cat /tmp/dispatch.out
                    exit 1
                  fi
                  echo "Dispatched fleetbase-release ($TAG) to fleetbase/showcase"
