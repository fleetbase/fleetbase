name: API CI

# Runs the host Laravel app's PHPUnit suite (api/tests) against real MySQL + Redis
# service containers, then reports coverage over api/app. The extension packages
# (core-api, fleetops-api, …) have their own CI in their own repos; this workflow
# covers the host application that wires them together.

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: api

jobs:
  test:
    name: PHPUnit + Coverage
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0-oracle
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: fleetbase_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # Test DB/cache/queue point at the service containers. Feature tests that
      # use RefreshDatabase will migrate into fleetbase_test.
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: fleetbase_test
      DB_USERNAME: root
      DB_PASSWORD: ""
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_DRIVER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, gd, zip, pdo_mysql, redis, sockets, intl, bcmath, gmp, geos
          coverage: xdebug

      - name: Install additional system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libzip-dev libgd-dev libgeos-dev libgmp-dev default-mysql-client libicu-dev

      - name: Configure Composer auth for GitHub
        env:
          # Falls back to the run's built-in token when _GITHUB_AUTH_TOKEN is not
          # set (forks, client repos). api/composer.json resolves only public
          # dists plus registry.fleetbase.io, which does not use github-oauth, so
          # GITHUB_TOKEN is enough here and lifts the anonymous 60/hr API limit.
          #
          # The guard matters: writing an empty value still produces a
          # `"github.com": ""` entry in auth.json, and Composer then sends an
          # empty Bearer token and 401s on every dist download
          # ("Could not authenticate against github.com"). With --no-interaction
          # it cannot prompt and --prefer-dist disables the source fallback, so
          # the install dies outright — strictly worse than no entry at all.
          TOKEN: ${{ secrets._GITHUB_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [[ -n "$TOKEN" ]]; then
            composer config --global github-oauth.github.com "$TOKEN"
          else
            echo "::warning::No GitHub token available; Composer will download dists anonymously."
          fi

      - name: Prepare environment file
        run: |
          [ -f .env ] || cp .env.example .env
          php artisan key:generate --force || true

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run tests
        run: composer test:unit

      - name: Generate coverage report
        run: composer coverage:baseline

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: api/coverage/clover.xml
          disable_search: true
          flags: api
          name: api-coverage
          fail_ci_if_error: false

      # Coverage gate — blocking.
      #
      # api/app is at 100% line coverage (composer coverage:check --fail-under=100),
      # so this is now a required check rather than the advisory step it started
      # as. This is the "flip to required" step described in the plan; the console
      # gate in console.yml has been blocking since it reached 100%.
      #
      # One file is excluded rather than tested, with the reason written at the
      # site in api/phpunit.xml: App\Providers\BroadcastServiceProvider is
      # commented out of config/app.php and its boot() requires a routes/channels.php
      # this app does not have, so it would fatal if it were ever wired up.
      - name: Enforce coverage threshold (100%)
        run: composer coverage:check
