name: API CI

# Runs the host Laravel app's PHPUnit suite (api/tests) against real MySQL + Redis
# service containers, then reports coverage over api/app. The extension packages
# (core-api, fleetops-api, …) have their own CI in their own repos; this workflow
# covers the host application that wires them together.

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main, 'dev-v*', 'release/v*', feature/extensions-registry-v2]

permissions:
  contents: read

defaults:
  run:
    working-directory: api

jobs:
  test:
    name: PHPUnit + Coverage
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0-oracle
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: fleetbase_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # Test DB/cache/queue point at the service containers. Feature tests that
      # use RefreshDatabase will migrate into fleetbase_test.
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: fleetbase_test
      DB_USERNAME: root
      DB_PASSWORD: ""
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_DRIVER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, gd, zip, pdo_mysql, redis, sockets, intl, bcmath, gmp, geos
          coverage: xdebug

      - name: Install additional system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libzip-dev libgd-dev libgeos-dev libgmp-dev default-mysql-client libicu-dev

      - name: Configure Composer auth for GitHub
        env:
          # Falls back to the run's built-in token when _GITHUB_AUTH_TOKEN is not
          # set (forks, client repos). api/composer.json resolves only public
          # dists plus registry.fleetbase.io, which does not use github-oauth, so
          # GITHUB_TOKEN is enough here and lifts the anonymous 60/hr API limit.
          #
          # The guard matters: writing an empty value still produces a
          # `"github.com": ""` entry in auth.json, and Composer then sends an
          # empty Bearer token and 401s on every dist download
          # ("Could not authenticate against github.com"). With --no-interaction
          # it cannot prompt and --prefer-dist disables the source fallback, so
          # the install dies outright — strictly worse than no entry at all.
          TOKEN: ${{ secrets._GITHUB_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [[ -n "$TOKEN" ]]; then
            composer config --global github-oauth.github.com "$TOKEN"
          else
            echo "::warning::No GitHub token available; Composer will download dists anonymously."
          fi

      - name: Prepare environment file
        run: |
          [ -f .env ] || cp .env.example .env
          php artisan key:generate --force || true

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # The extensions (api/extensions) are a Composer project of their own, resolved against the packages
      # core installs (fleetbase/core-platform, see api/extensions/README.md). A core lock change that an
      # extension in the shipped extensions lock does not accept fails here, not on an instance.
      - name: Check the extensions lock resolves against core
        run: |
          composer validate --no-check-publish --no-check-all --working-dir=extensions
          php scripts/extensions-core-platform.php
          composer update fleetbase/core-platform --dry-run --no-dev --no-interaction --no-progress --working-dir=extensions

      - name: Run tests
        run: composer test:unit

      - name: Generate coverage report
        run: composer coverage:baseline

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: api/coverage/clover.xml
          disable_search: true
          flags: api
          name: api-coverage
          fail_ci_if_error: false

      # Coverage gate — blocking.
      #
      # api/app is at 100% line coverage (composer coverage:check --fail-under=100),
      # so this is now a required check rather than the advisory step it started
      # as. This is the "flip to required" step described in the plan; the console
      # gate in console.yml has been blocking since it reached 100%.
      #
      # One file is excluded rather than tested, with the reason written at the
      # site in api/phpunit.xml: App\Providers\BroadcastServiceProvider is
      # commented out of config/app.php and its boot() requires a routes/channels.php
      # this app does not have, so it would fatal if it were ever wired up.
      - name: Enforce coverage threshold (100%)
        run: composer coverage:check

  # A fresh install against real MySQL, normal and sandbox. The extension suites run
  # on SQLite stand-in schemas that never load the spatial connection, so they stay
  # green while a migration or the connection class itself is fatal on MySQL.
  migrate:
    name: Fresh MySQL Migrate (${{ matrix.mysql }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # 8.4 turns on restrict_fk_on_non_standard_key by default, as production's RDS 8.4.8 does.
    # A fresh install still needs core-api's migration hook for the older create migrations; the
    # last step then proves that, once migrated, no table needs it.
    strategy:
      fail-fast: false
      matrix:
        mysql: ['8.0-oracle', '8.4.8']

    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: production
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: fleetbase
      DB_USERNAME: root
      DB_PASSWORD: ""
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_DRIVER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, gd, zip, pdo_mysql, redis, sockets, intl, bcmath, gmp, geos
          coverage: none

      - name: Install additional system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libzip-dev libgd-dev libgeos-dev libgmp-dev default-mysql-client libicu-dev

      - name: Configure Composer auth for GitHub
        env:
          # See the guard in the test job: an empty token makes Composer 401.
          TOKEN: ${{ secrets._GITHUB_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [[ -n "$TOKEN" ]]; then
            composer config --global github-oauth.github.com "$TOKEN"
          else
            echo "::warning::No GitHub token available; Composer will download dists anonymously."
          fi

      - name: Prepare environment file
        run: '[ -f .env ] || cp .env.example .env'

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # Extensions (Fleet-Ops, Storefront, ...) are their own Composer project in api/extensions. Install it so
      # mysql:createdb, migrate and sandbox:migrate see their databases and migrations, as an instance does.
      - name: Install extensions
        run: |
          php scripts/extensions-core-platform.php
          composer install --prefer-dist --no-progress --no-interaction --working-dir=extensions

      - name: Generate app key
        run: php artisan key:generate --force

      - name: Create databases
        run: php artisan mysql:createdb

      - name: Migrate
        run: php artisan migrate --force

      - name: Migrate sandbox
        run: php artisan sandbox:migrate --force

      - name: Assert both connections migrated
        run: bash ../scripts/ci/assert-migrated.sh

      - name: Assert foreign keys point at unique keys
        run: bash ../scripts/ci/assert-fk-targets-unique.sh
