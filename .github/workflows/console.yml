name: Console CI

# Runs the Ember console's lint + QUnit suite + coverage from the monorepo root.
# NOTE: console/ is tracked directly in this repo (not a submodule), and GitHub
# only executes workflows under the repo-root .github/workflows/. So THIS file —
# not console/.github/workflows/ci.yml — is what gates the console in fleetbase-dev.

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: 22.x

defaults:
  run:
    working-directory: console

jobs:
  build-and-test:
    name: Lint, Test, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Get pnpm Store Directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        name: Setup pnpm Cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('console/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Create .npmrc
        run: |
          if [[ -n "${{ secrets._GITHUB_AUTH_TOKEN }}" ]]; then
            echo "@fleetbase:registry=https://npm.pkg.github.com/" > .npmrc
            echo "//npm.pkg.github.com/:_authToken=${{ secrets._GITHUB_AUTH_TOKEN }}" >> .npmrc
          fi

      - name: Install Dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      # The step that was previously missing everywhere for the console: actually
      # running the existing QUnit suite (tests/unit + tests/integration), here
      # with coverage instrumentation.
      - name: Test (with coverage)
        run: pnpm run test:ember:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: console/coverage/lcov.info
          disable_search: true
          flags: console
          name: console-coverage
          fail_ci_if_error: false

      # Coverage gate. Long-term target is 100% (scripts/coverage-check.mjs); the
      # threshold ratchets up as the suite grows.
      #
      # 35 is the floor the suite currently holds. Measured locally at 392/392:
      #   lines 44.06% · statements 43.57% · functions 40.22% · branches 36.18%
      # The check applies the threshold to ALL FOUR metrics, so branches is the
      # binding constraint — 40 would fail today despite lines being at 44%.
      #
      # Until this commit the console produced no coverage report at all (no babel
      # instrumentation, no sendCoverage hook, and a scoped-modulePrefix path
      # mismatch), so this gate has never actually evaluated anything. It stays
      # continue-on-error for one release so the first real CI report can be
      # observed; drop that line to make it a required, blocking check.
      - name: Enforce coverage threshold
        continue-on-error: true
        run: pnpm run coverage:check -- --fail-under=35

      - name: Build (production)
        run: npx ember build --environment production
