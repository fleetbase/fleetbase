name: Console CI

# Runs the Ember console's lint + QUnit suite + coverage from the monorepo root.
# NOTE: console/ is tracked directly in this repo (not a submodule), and GitHub
# only executes workflows under the repo-root .github/workflows/. So THIS file —
# not console/.github/workflows/ci.yml — is what gates the console in fleetbase-dev.

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: 22.x

defaults:
  run:
    working-directory: console

jobs:
  build-and-test:
    name: Lint, Test, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Get pnpm Store Directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        name: Setup pnpm Cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('console/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # No .npmrc is written on purpose. Every @fleetbase/* package this app depends on
      # is published to the public npm registry, so the default registry resolves them
      # with no credentials — which is what an OSS repo needs: forks and outside
      # contributors must be able to install without any token.
      #
      # An earlier version of this step wrote "@fleetbase:registry=https://npm.pkg.github.com/"
      # whenever the _GITHUB_AUTH_TOKEN secret was present. That redirected the whole
      # @fleetbase scope to GitHub Packages, where these packages are not published, and
      # install died with ERR_PNPM_FETCH_404 on @fleetbase/ember-core. Note it failed only
      # on the main repo (which has the secret) and passed on forks (which do not).
      - name: Install Dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      # The step that was previously missing everywhere for the console: actually
      # running the existing QUnit suite (tests/unit + tests/integration), here
      # with coverage instrumentation.
      - name: Test (with coverage)
        run: pnpm run test:ember:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: console/coverage/lcov.info
          disable_search: true
          flags: console
          name: console-coverage
          fail_ci_if_error: false

      # Coverage gate — blocking.
      #
      # The console suite is at 100% on all four metrics (lines, statements,
      # functions and branches) with 1149 tests passing. scripts/coverage-check.mjs
      # applies the threshold to all four, so this fails the build if any of them
      # regresses.
      #
      # A handful of lines are excluded or marked rather than tested, each with the
      # reason written at the site: window.location.reload() cannot be stubbed
      # (Location members are non-configurable per spec) so its five callers route
      # through a one-line reloadWindow()/reloadConsole() wrapper; a few guards are
      # unreachable given their callers; and app/resolver.js is excluded outright in
      # config/coverage.js because nothing imports it and it would throw if it were
      # wired up.
      - name: Report coverage threshold
        run: pnpm run coverage:check -- --fail-under=100

      - name: Build (production)
        run: npx ember build --environment production
