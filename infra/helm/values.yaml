# Default values for helm.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

image:
  repository: OVERRIDE
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: ""
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: OVERRIDE
    networking.gke.io/managed-certificates: managed-cert
    networking.gke.io/v1beta1.FrontendConfig: "httpsredirect"

  tls: {}
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

gcp: true

# Realtime socket server (fleetbase/fleetbase-socket). The public websocket is served through
# the ingress at socketcluster_host; the internal publish listener (8001) is a ClusterIP-only
# Service the API reaches as socketcluster-internal:8001.
socketcluster:
  image:
    repository: fleetbase/fleetbase-socket
    # Pin this to the release you deploy (e.g. "v0.7.69"); "latest" is re-pulled on every rollout.
    tag: "latest"
    pullPolicy: Always
  replicas: 1
  # off | log | enforce. Empty: enforce when a key is configured, otherwise off.
  authMode: ""
  # Shared socket auth key (>= 32 characters), used by the API and the socket server.
  # Prefer existingSecret; setting authKey makes the chart create a Secret from it.
  # With neither set, socket auth stays off unless SOCKETCLUSTER_AUTH_KEY is provided
  # to the API through infra-provided-secret AND to the socket server via extraEnv.
  authKey: ""
  existingSecret: ""
  existingSecretKey: SOCKETCLUSTER_AUTH_KEY
  # Override the API authorize endpoint. Default: the API Service's /int/v1/socket/authorize.
  authorizeUrl: ""
  # SOCKETCLUSTER_OPTIONS JSON, e.g. '{"origins":"https://console.example.com:*"}'
  options: ""
  # Extra env for the socket container (e.g. SCC_STATE_SERVER_HOST for multiple replicas).
  extraEnv: []
  resources: {}
