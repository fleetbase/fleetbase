linkWorkspacePackages: deep
preferWorkspacePackages: true
publicHoistPattern:
  - "*ember-core*"
  - "*ember-ui*"
  - "*fleetops-data*"
overrides:
  "@fleetbase/fleetops-data": "^0.2.2"
  "@fleetbase/ember-core": "^0.3.24"
  "@fleetbase/ember-ui": "^0.4.4"
allowBuilds:
  "@fortawesome/fontawesome-common-types": false
  "@fortawesome/fontawesome-svg-core": false
  "@fortawesome/free-brands-svg-icons": false
  "@fortawesome/free-solid-svg-icons": false
  core-js: false
  fsevents: false
minimumReleaseAgeExclude:
  - '@fleetbase/customer-portal-engine@0.0.15'
  - '@fleetbase/ember-ui@0.4.4'
  - '@fleetbase/fleetops-engine@0.6.70'
  - '@fleetbase/ledger-engine@0.0.11'
  - '@fleetbase/registry-bridge-engine@0.1.10'
  - '@fleetbase/storefront-engine@0.4.22'
