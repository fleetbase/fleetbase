  - "*ember-ui*"
  - "*fleetops-data*"
overrides:
  "@fleetbase/fleetops-data": "^0.2.2"
  "@fleetbase/ember-core": "^0.3.25"
  "@fleetbase/ember-ui": "^0.4.5"
allowBuilds:
