# feature/map-canvas: ember-ui and ember-core come from their submodules (packages/*,
# checked out on their feature/map-canvas commits) so the unreleased canvas shell
# loads. Swap back to the published versions when they are released.
packages:
  - "../packages/ember-core"
  - "../packages/ember-ui"
linkWorkspacePackages: deep
preferWorkspacePackages: true
publicHoistPattern:
  - "*ember-core*"
  - "*ember-ui*"
  - "*fleetops-data*"
overrides:
  "@fleetbase/fleetops-data": "^0.2.4"
  "@fleetbase/ember-core": "workspace:*"
  "@fleetbase/ember-ui": "workspace:*"
allowBuilds:
  "@fortawesome/fontawesome-common-types": false
  "@fortawesome/fontawesome-svg-core": false
  "@fortawesome/free-brands-svg-icons": false
  "@fortawesome/free-solid-svg-icons": false
  core-js: false
  fsevents: false
minimumReleaseAgeExclude:
  - '@fleetbase/fleetops-data@0.2.4'
  - '@fleetbase/fleetops-engine@0.7.3'
  - '@fleetbase/storefront-engine@0.5.0'
  - '@fleetbase/ledger-engine@0.1.0'
  - '@fleetbase/customer-portal-engine@0.1.0'
  - '@fleetbase/dev-engine@0.2.18'
  - '@fleetbase/registry-bridge-engine@0.2.1'
  - '@fleetbase/valhalla-engine@0.1.0'
  - '@fleetbase/vroom-engine@0.1.0'
  - '@fleetbase/ai-engine@0.1.0'
