      message: Чи не отримали код?
      alternative-choice: Використовуйте альтернативні варіанти нижче для підтвердження акаунту.
      resend-email: Надіслати лист повторно
      send-by-sms: Надіслати SMS

  two-fa:
    verify-code:
      verification-code: Код підтвердження
      check-title: Перевірте вашу пошту або телефон
      check-subtitle: Ми відправили вам код підтвердження. Введіть код нижче, щоб завершити процес входу.
      expired-help-text: Ваш код двофакторний автентифікації минув. Ви можете запросити новий код, якщо вам потрібно більше часу.
      resend-code: Надіслати код повторно
      verify-code: Підтвердити код
      cancel-two-factor: Скасувати двофакторну автентифікацію
      invalid-session-error-notification: Недійсна сесія. Будь ласка, спробуйте знову.
      verification-successful-notification: Підтвердження минуло успішно !
      verification-code-expired-notification: Код підтвердження минув. Будь ласка, запитайте новий.
      verification-code-failed-notification: Підтвердження не вдалося. Будь ласка, спробуйте знову.

    resend-code:
      verification-code-resent-notification: Новий код підтвердження відправлений.
      verification-code-resent-error-notification: Помилка повторної відправці коду підтвердження. Будь ласка, спробуйте знову.

  forgot-password:
    success-message: Перевірте вашу електронну пошту, щоб продовжити !
    is-sent:
      title: Майже готово!
      message: <strong>Перевірте вашу пошту!</strong><br> Ми відправили вам чарівне посилання на електронну пошту, яка дозволить скинути пароль. Посилання діє 15 хвилин.
    not-sent:
      title: Забули пароль?
      message: <strong>Не хвилюйтеся, ми допоможемо.</strong><br> Введіть електронну пошту, яку ви Ви використовуєте для входу в {appName}, і ми відправимо вам безпечну посилання для скидання пароля.
    form:
      email-label: Ваша електронна адреса пошти
      submit-button: ОК, надішліть мені чарівне посилання !
      nevermind-button: Не важливо

  login:
    title: Увійдіть у свій акаунт
    no-identity-notification: Ви забули ввести електронну пошту ?
    no-password-notification: Ви забули ввести пароль?
    unverified-notification: Ваш обліковий запис повинен бути підтверджений для продовження.
    password-reset-required: Для продовження потрібно скидання пароля.
    failed-attempt:
      message: <strong>Забули пароль?</strong><br> Натисніть кнопку нижче, щоб скинути пароль.
      button-text: Ок, допоможіть скинути !

