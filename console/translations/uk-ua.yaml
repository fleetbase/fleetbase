auth:
  verification:
    header-title: Підтвердження акаунту
    title: Підтвердіть вашу електронну адресу пошти
    message-text: <strong>Майже готово!</strong><br> Перевірте вашу електронну пошту для коду підтвердження.
    verification-code-text: Введіть код підтвердження, який ви отримали по електронній поштою.
    verification-input-label: Код підтвердження
    verify-button-text: Підтвердити та продовжити
    didnt-receive-a-code: Чи не отримали код?
