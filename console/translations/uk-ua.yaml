      email-label: Адреса електронної пошти
      password-label: Пароль
      remember-me-label: Запамятати мене
      forgot-password-label: Забули пароль?
      sign-in-button: Увійти
      create-account-button: Створити новий акаунт
    slow-connection-message: Проблеми із підключенням.

  reset-password:
    success-message: Ваш пароль був скинутий ! Увійдіть, щоб продовжити.
    invalid-verification-code: Ця посилання для скидання пароля недійсне або закінчилася.
    title: Скиньте пароль
    form:
      code:
        label: Ваш код скидання
        help-text: Код підтвердження, який ви отримали на електронну пошту.
      password:
        label: Новий пароль
        help-text: Введіть пароль довжиною щонайменше 6 символів для продовження.
      confirm-password:
        label: Підтвердіть новий пароль
        help-text: Введіть пароль довжиною щонайменше 6 символів для продовження.
      submit-button: Скинути пароль
      back-button: Назад

  confirm-email-change:
    success-message: Your email address has been updated.
    invalid-verification-code: This email change link is invalid or expired.
    title: Confirm email change
    message-text: Confirm this change to update the login email for your Fleetbase account.
    form:
      code:
        label: Confirmation code
        help-text: The confirmation code from your email.
      submit-button: Confirm Email Change
      back-button: Back

